hero:
  subtitle: Modern app development driven by a passion for new technologies
  about_title: A few words about me
  about_paragraphs:
    - I specialize in Android development, and with Kotlin Multiplatform I also build shared modules for other platforms. I move comfortably between mobile, web, and electronics - creating small web apps and prototyping software for Arduino, ESP boards, and similar hardware. I enjoy building, soldering, and quickly validating ideas in the real world.
    - I enjoy new challenges, use AI where it adds value, and can work just as comfortably in a more traditional engineering style. I write tests, help shape specifications, improve existing solutions, and support products scaling to 200M+ users.
    - Depending on the need, I build standalone apps or connect multiple environments together. I keep learning, share knowledge through discussions and code reviews, and bring proven patterns while staying open to conversation and existing ways of working.

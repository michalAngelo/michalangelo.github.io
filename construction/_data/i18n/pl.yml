hero:
  subtitle: Nowoczesne tworzenie aplikacji napędzane pasją do nowych technologii
  about_title: Kilka słów o mnie
  about_paragraphs:
    - Specjalizuję się w Androidzie, ale dzięki Kotlin Multiplatform tworzę też moduły na inne platformy i swobodnie łączę projekty od webu po elektronikę. Tworzę drobne aplikacje webowe, prototypowe programy na Arduino/ESP i inne płytki - lubię coś skręcić, polutować i szybko sprawdzić pomysł w realnym świecie.
    - Uwielbiam nowe wyzwania, korzystam z AI tam, gdzie to dozwolone, ale potrafię pisać w klasycznym stylu. Piszę testy, współtworzę specyfikacje, poprawiam istniejące rozwiązania i wspieram produkty skalujące się do 200+ mln użytkowników.
    - W zależności od potrzeb buduję pojedyncze aplikacje lub łączę środowiska, stale się uczę i dzielę wiedzą w dyskusjach i przeglądach kodu - mam sprawdzone schematy, ale zawsze jestem otwarty na rozmowę i dopasowanie się do istniejącego modelu działania.
